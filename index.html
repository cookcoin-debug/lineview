<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LineView — Supercharts</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#131722;--pane:#1e222d;--pane2:#171b26;--line:#2a2e39;--text:#d1d4dc;--muted:#787b86;--accent:#2962ff;--up:#26a69a;--down:#ef5350;--gold:#d4a017;--warn:#ff9800}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:12px/1.35 "Trebuchet MS","Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{display:grid;height:100%;width:100%;max-width:1280px;min-width:0;margin:0 auto;overflow-x:hidden;grid-template-rows:auto 1fr 30px}
.top,.bot,.left{background:#0f131a}
.top{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);min-width:0}
.logo{font-weight:800;color:#fff;font-size:14px}.logo span{color:var(--accent)}
.sym{background:var(--pane);border:1px solid var(--line);padding:5px 8px;min-width:0;width:180px;max-width:100%;border-radius:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{padding:4px 8px;color:var(--muted)}.seg button.on{background:var(--accent);color:#fff}
.grow{flex:1}
.chip{border:1px solid var(--line);padding:3px 7px;border-radius:3px;color:var(--muted)}
.chip.warn{color:var(--warn);border-color:#5a3d16}.chip.on{border-color:var(--accent);color:#fff}
.chip.live{color:var(--up);border-color:#1b5e55}
.desk{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,280px);min-width:0;min-height:0}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:4px}
.left button{width:32px;height:32px;border-radius:4px;color:var(--muted)}
.left button.on,.left button:hover{background:var(--pane);color:#fff}
.mid{display:grid;grid-template-rows:34px 7fr 2.2fr 0.8fr 24px;min-width:0;min-height:0}
.mid.handle-off{grid-template-rows:34px 1fr 118px 24px}
.legend{display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--pane2)}
.legend .name{font-weight:700;font-size:13px}
.px{font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--down)}
#chartA,#chartB,#chartC{width:100%;height:100%}
.paneB,.paneC{border-top:1px solid var(--line);position:relative;min-height:0}
.paneC.hidden{display:none}
.tag{position:absolute;left:8px;top:4px;z-index:2;color:var(--muted);font-size:10px;letter-spacing:.4px;text-transform:uppercase;pointer-events:none}
.xaxis{display:flex;justify-content:space-between;align-items:center;padding:0 10px;color:var(--muted);border-top:1px solid var(--line);font-size:11px}
.right{border-left:1px solid var(--line);display:grid;grid-template-rows:32px 1fr 168px;min-width:0;min-height:0;background:var(--pane)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:8px 0;color:var(--muted)}.tabs button.on{color:#fff;border-bottom:2px solid var(--accent)}
.list{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid #252a36;font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--pane)}
tr.active{background:#1a2740}tr:hover{background:#182230;cursor:pointer}
.details{border-top:1px solid var(--line);padding:8px 10px;overflow:auto;color:var(--muted);font-size:12px}
.details h4{margin:0 0 6px;color:var(--text);font-size:12px}
.bot{display:flex;align-items:center;gap:10px;padding:0 10px;border-top:1px solid var(--line);color:var(--muted)}
.bot input[type=range]{width:170px}
.flag{font-size:10px;padding:1px 4px;border-radius:2px;background:#2a3340;color:var(--muted)}
.flag.rlm{background:#3a2418;color:#ffb74d}.flag.steam{background:#132e2b;color:var(--up)}
.modal{position:fixed;inset:72px auto auto 50%;transform:translateX(-50%);width:min(560px,90vw);background:var(--pane);border:1px solid var(--line);border-radius:6px;display:none;z-index:20;box-shadow:0 16px 50px #000a}
.modal.on{display:block}
.modal input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 12px;outline:none}
.hit{padding:8px 12px;border-bottom:1px solid #252a36;cursor:pointer}.hit:hover{background:#182230}

@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap");
html,body{font-family:"IBM Plex Sans","Trebuchet MS","Segoe UI",sans-serif;background:#090b10;letter-spacing:.01em}
.app{background:radial-gradient(1200px 600px at 35% 0%,#141a28 0%,#090b10 55%)}
.top,.bot,.left{background:rgba(8,10,16,.92);backdrop-filter:saturate(1.2)}
.logo{letter-spacing:.08em;font-weight:700}.logo span{background:linear-gradient(180deg,#7aa2ff,#2962ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sym,.chip,.seg{border-color:#232838}
.px,.sym,th,td,#legPx,#cap,#clock{font-family:"IBM Plex Mono","Trebuchet MS",monospace;font-variant-numeric:tabular-nums}
.legend{background:linear-gradient(180deg,#141824,#10141c)}
.tag{letter-spacing:.14em;opacity:.7}
tr.active{background:linear-gradient(90deg,#152036,#1a2740);box-shadow:inset 2px 0 0 #2962ff}
tr.live-row{box-shadow:inset 2px 0 0 #26a69a}
tr.final-row{opacity:.72}
.pip{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#3a4154;vertical-align:middle}
.pip.live{background:#26a69a;box-shadow:0 0 0 0 rgba(38,166,154,.7);animation:pulse 1.8s ease-out infinite}
.pip.open{background:#d4a017;box-shadow:0 0 8px #d4a01755}
.pip.lock{background:#5c6378}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(38,166,154,.55)}70%{box-shadow:0 0 0 8px rgba(38,166,154,0)}100%{box-shadow:0 0 0 0 rgba(38,166,154,0)}}
.score{color:#9aa3b5;font-size:11px;padding-left:6px}
.toasts{position:fixed;right:18px;bottom:46px;display:flex;flex-direction:column;gap:8px;z-index:40;width:min(340px,92vw);pointer-events:none}
.toast{pointer-events:auto;background:rgba(16,20,30,.92);border:1px solid #2a3144;border-left:3px solid #2962ff;padding:10px 12px;border-radius:4px;box-shadow:0 12px 40px #0008;animation:rise .35s ease}
.toast.steam{border-left-color:#26a69a}
.toast.rlm{border-left-color:#ff9800}
.toast.lock{border-left-color:#8d99ae}
.toast.live{border-left-color:#26a69a}
.toast.open{border-left-color:#d4a017}
.toast .kicker{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b93a7;margin-bottom:2px}
.toast .line{color:#e8edf7;font-size:13px;line-height:1.35}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#clock{color:#8b93a7;font-size:11px}
.scanbar{height:1px;background:linear-gradient(90deg,transparent,#2962ff66,transparent);animation:scan 7s linear infinite;opacity:.5}
@keyframes scan{from{transform:translateX(-40%)}to{transform:translateX(40%)}}
.bot{position:relative}
.app.pregame .mid,.app.pregame .left{display:none}
.app.pregame .right{display:grid;grid-template-rows:32px 1fr}
.app.pregame .details{display:none}
.app.pregame .desk{grid-template-columns:minmax(0,1fr) minmax(240px,280px);min-height:0}
.app.pregame #pre{min-height:0;height:100%}
#pre{display:none;overflow:auto;padding:14px 16px 24px;background:
  radial-gradient(900px 420px at 10% -10%,#2a1650 0%,transparent 50%),
  radial-gradient(800px 380px at 90% 0%,#0d2a28 0%,transparent 46%),
  #07090f}
.app.pregame #pre{display:block}
.pre-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.pre-hero h1{margin:0;font-size:28px;letter-spacing:.04em;color:#fff}
.pre-hero .sub{color:#9aa3b5;margin-top:4px}
.rack{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;grid-auto-rows:min-content;gap:12px}
.card{position:relative;border-radius:10px;padding:12px 14px 14px;background:linear-gradient(180deg,#161b28,#10141c);border:1px solid #2a3144;box-shadow:0 10px 28px #0006;height:max-content;min-height:0;overflow:visible}
.card:before{content:"";position:absolute;inset:0 auto auto 0;height:3px;width:100%}
.card.mythic{border-color:#f0c14b88}.card.mythic:before{background:linear-gradient(90deg,#f0c14b,#ff7a18)}
.card.legend{border-color:#b388ff88}.card.legend:before{background:linear-gradient(90deg,#7c4dff,#e040fb)}
.card.epic{border-color:#40c4ff88}.card.epic:before{background:linear-gradient(90deg,#29b6f6,#26a69a)}
.card.rare{border-color:#26a69a88}.card.rare:before{background:#26a69a}
.card.empty{opacity:.72;border-style:dashed;padding:10px 14px}
.card h3{margin:0 0 10px;padding-right:64px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c5cbe0;line-height:1.3}
.card .big{font-size:22px;font-weight:700;color:#fff;letter-spacing:.02em;font-family:"IBM Plex Mono",monospace}
.card p{margin:6px 0 0;color:#9aa3b5;font-size:12px;line-height:1.45}
.src{position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:#1b2230;color:#8b93a7}
.src.m{color:#26a69a;background:#132e2b}.src.p{color:#b388ff;background:#24183a}.src.e{color:#8b93a7}
.bar{height:8px;border-radius:99px;background:#1b2230;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#26a69a,#7c4dff)}
.bar.sf>i{background:linear-gradient(90deg,#ff7a18,#ef5350)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:#1b2230;color:#d1d4dc}
.pill.hot{background:#3a2418;color:#ffb74d}.pill.own{background:#24183a;color:#e040fb}.pill.go{background:#132e2b;color:#26a69a}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.lu ol{margin:0;padding-left:18px;color:#cfd6e4;font-size:12px}
.note-empty{color:#6f7684;font-style:italic}
.app.live .mid,.app.live .left,.app.live .right{display:none}
.app.live .desk{grid-template-columns:1fr}
#live{display:none;overflow:auto;padding:14px 18px 24px;background:radial-gradient(720px 280px at 12% -20%,#152238 0%,transparent 55%),#0b0e14}
.app.live #live{display:block}
.live-hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #1e2533}
.live-score{font-family:"IBM Plex Mono",monospace;font-size:36px;font-weight:600;color:#fff;letter-spacing:.06em;line-height:1}
.live-score small{font-size:13px;letter-spacing:.14em;color:#8b93a7;margin-left:10px;font-weight:500}
.live-meta{color:#8b93a7;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.live-type{font-family:"IBM Plex Mono",monospace;font-size:28px;color:#fff;text-align:right;line-height:1}
.live-type em{font-style:normal;color:#26a69a;margin-right:8px}
.live-type span{color:#8b93a7;font-size:12px;display:block;margin-top:6px;letter-spacing:.08em}
.live-grid{display:grid;grid-template-columns:minmax(240px,280px) minmax(320px,1fr);gap:12px}
.zone{background:#10141c;border:1px solid #2a3144;border-radius:8px;padding:12px}
.zone svg{width:100%;height:248px;display:block}
.dot-leg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:10px;letter-spacing:.08em;color:#8b93a7;text-transform:uppercase}
.dot-leg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#1e2533;border:1px solid #1e2533;border-radius:8px;overflow:hidden;margin-top:10px}
.kv b{display:block;background:#10141c;padding:10px 8px 8px;font-family:"IBM Plex Mono",monospace;font-size:16px;color:#fff;font-weight:600}
.kv b i{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8b93a7;margin-bottom:4px;font-family:"Trebuchet MS",sans-serif;font-weight:500}
.pa{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:11px}
.pa div{display:grid;grid-template-columns:32px 42px 1fr 52px;gap:8px;padding:5px 0;border-bottom:1px solid #1b2230;color:#c5cbe0}
.pa div.on{color:#fff;background:#151b26;margin:0 -8px;padding:5px 8px}
.live-tape{max-height:168px;overflow:auto;margin-top:12px;border-top:1px solid #1e2533;padding-top:8px}
.live-tape div{padding:4px 0;border-bottom:1px solid #151b26;color:#9aa3b5;font-size:11px;font-family:"IBM Plex Mono",monospace}
@media (max-width:1100px){.live-grid{grid-template-columns:1fr}}
.app.phone.live .top .sym,.app.phone.live .top #mkt,.app.phone.live .top #tf,.app.phone.live .top #side,.app.phone.live .top #style,.app.phone.live .top .chip{display:none}
.app.phone.live .top{gap:6px;padding:0 8px}
.app.phone.live #live{padding:10px 10px calc(18px + env(safe-area-inset-bottom,0px))}
.app.phone.live .top .seg button{min-height:36px;padding:6px 10px}
.app.phone .live-hero{grid-template-columns:1fr;gap:10px}
.app.phone .live-score{font-size:42px}
.app.phone .live-type{text-align:left;font-size:34px}
.app.phone .live-grid{grid-template-columns:1fr;gap:10px}
.app.phone .zone svg{height:300px}
.app.phone .kv{grid-template-columns:repeat(2,1fr)}
.app.phone .kv b{font-size:20px;padding:12px 10px 10px}
.app.phone .pa div,.app.phone .live-tape div{font-size:13px;padding:8px 0}
.app.phone .live-tape{max-height:none}
.app.model .mid,.app.model .left,.app.model .right{display:none}
.app.model .desk{grid-template-columns:1fr}
#mod{display:none;overflow:auto;padding:14px 18px 24px;background:#0b0e14}
.app.model #mod{display:block}
.mod-grid{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:14px}
.mod-grid label{display:block;margin:10px 0 4px;color:#8b93a7;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.mod-grid input[type=range]{width:100%}
.mod-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.mod-stat b{display:block;background:#10141c;border:1px solid #1e2533;border-radius:8px;padding:10px;font-family:"IBM Plex Mono",monospace;font-size:18px;color:#fff}
.mod-stat b i{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8b93a7;margin-bottom:4px;font-family:"Trebuchet MS",sans-serif}
.mod-rows{max-height:280px;overflow:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;margin-top:10px}
.mod-rows div{display:grid;grid-template-columns:1fr 52px 52px 40px;gap:8px;padding:4px 0;border-bottom:1px solid #151b26;color:#9aa3b5}
@media (max-width:900px){.mod-grid{grid-template-columns:1fr}}

</style>

<body>

<script>
const impl=p=>{const n=+String(p).replace("+","");if(!Number.isFinite(n)||n===0)return null;return n<0?(-n)/((-n)+100):100/(n+100)};
const fmtAm=p=>{const n=+String(p).replace("+","");if(!Number.isFinite(n))return "—";return (n>0?"+":"")+Math.round(n)};
const pct=x=>x==null?"—":(x*100).toFixed(1)+"%";
function toUnix(s){
  if(!s)return NaN;
  const str=String(s);
  if(/T/.test(str)&&( /Z$|[+-]\d\d:\d\d$/.test(str)))return Math.floor(Date.parse(str)/1000);
  return Math.floor(Date.parse(str.replace(" ","T")+"-07:00")/1000);
}
function flagSplit(rlm){const n=+rlm;if(!Number.isFinite(n)||n===0)return{kind:"",label:""};if(n>=25)return{kind:"steam",label:"STEAM "+n};if(n<=-25)return{kind:"rlm",label:"RLM "+n};return{kind:"",label:String(n)};}
const BOOK_COLOR={Circa:"#26a69a",OddsAPI:"#2962ff",DK:"#ab47bc",Pinnacle:"#d4a017",Cleatz:"#8d6e63",EAGAG:"#ef5350",Kalshi:"#00c853",Polymarket:"#7c4dff"};
const STORE_URL=window.LINEVIEW_STORE||"https://train-crossword-atom-intervention.trycloudflare.com/games";

function makeChart(el){if(!LC)return null;return LC.createChart(el,{autoSize:true,layout:{background:{color:"#131722"},textColor:"#d1d4dc",fontSize:11},grid:{vertLines:{color:"#2a2e39"},horzLines:{color:"#2a2e39"}},rightPriceScale:{borderColor:"#2a2e39"},timeScale:{borderColor:"#2a2e39",timeVisible:true,secondsVisible:false},crosshair:{mode:LC.CrosshairMode.Normal}});}
function ensureCharts(){
  if(!LC){document.getElementById("chartA").innerHTML='<div style="padding:16px;color:#787b86">Lightweight Charts CDN blocked.</div>';return false;}
  if(!chartA){
    chartA=makeChart(document.getElementById("chartA"));chartB=makeChart(document.getElementById("chartB"));chartC=makeChart(document.getElementById("chartC"));
    const sync=(src,dsts)=>src.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(!r)return;dsts.forEach(d=>{try{d.timeScale().setVisibleLogicalRange(r);}catch(e){}});});
    sync(chartA,[chartB,chartC]);sync(chartB,[chartA,chartC]);sync(chartC,[chartA,chartB]);
    chartA.subscribeCrosshairMove(p=>{const el=document.getElementById("legXh");if(!p||!p.time||!p.seriesData){el.textContent="";return;}const ser=seriesA[state.source]||Object.values(seriesA)[0];const d=ser&&p.seriesData.get(ser);const v=d&&(d.value!=null?d.value:d.close);el.textContent=v==null?"":v.toFixed(1)+"%";});
  }
  return true;
}
function clearSeries(){
  Object.values(seriesA).forEach(s=>{try{chartA.removeSeries(s);}catch(e){}});
  Object.values(seriesB).forEach(s=>{try{chartB.removeSeries(s);}catch(e){}});
  Object.values(seriesC).forEach(s=>{try{chartC.removeSeries(s);}catch(e){}});
  if(novigSeries){try{chartA.removeSeries(novigSeries);}catch(e){}}
  if(lockLine){try{chartA.removeSeries(lockLine);}catch(e){}}
  seriesA={};seriesB={};seriesC={};novigSeries=null;lockLine=null;
}
function draw(){
  if(!ensureCharts())return;clearSeries();
  const sources=Object.keys(state.compare).filter(k=>state.compare[k]);
  const primary=sources.includes(state.source)?state.source:(sources[0]||state.source);
  let firstT=null,lastT=null,lastPx=null,firstPx=null;
  sources.forEach(src=>{
    const raw=cut(ticksFor(state.game,src,state.market));if(!raw.length)return;
    const color=BOOK_COLOR[src]||"#2962ff";
    if(state.style==="candle"&&src===primary){
      seriesA[src]=chartA.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
      seriesB[src]=chartB.addCandlestickSeries({upColor:"#26a69a",downColor:"#ef5350",borderVisible:false,wickUpColor:"#26a69a",wickDownColor:"#ef5350"});
      seriesA[src].setData(candlePts(raw,"implied"));seriesB[src].setData(candlePts(raw,"juice"));
    }else{
      seriesA[src]=chartA.addLineSeries({color,lineWidth:src===primary?2:1.3,title:src});
      seriesB[src]=chartB.addLineSeries({color,lineWidth:src===primary?2:1.3,title:src});
      seriesA[src].setData(linePts(raw,"implied"));seriesB[src].setData(linePts(raw,"juice"));
    }
    if(!firstT){firstT=raw[0];firstPx=priceOf(raw[0]);}
    lastT=raw[raw.length-1];lastPx=priceOf(lastT);
    const hp=handlePts(raw);if(hp.length&&chartC){seriesC[src]=chartC.addHistogramSeries({priceFormat:{type:"price",precision:0,minMove:1},base:0});seriesC[src].setData(hp);}
  });
  setHandlePane(Object.keys(seriesC).length>0);
  if(state.novig&&lastT&&LC){
    const book=ticksFor(state.game,"Pinnacle",state.market).length?"Pinnacle":state.source;
    const nv=noVigPts(cut(ticksFor(state.game,book,state.market)));
    if(nv.length){novigSeries=chartA.addLineSeries({color:"#d4a017",lineWidth:1,lineStyle:LC.LineStyle.Dashed,title:"no-vig"});novigSeries.setData(nv);}
  }
  if(state.lock!=null&&LC){
    lockLine=chartA.addLineSeries({color:"#d1d4dc",lineWidth:1,lineStyle:LC.LineStyle.SparseDotted,title:"lock"});
    const pts=linePts(cut(ticksFor(state.game,primary,state.market)),"implied");
    if(pts.length)lockLine.setData(pts.map(p=>({time:p.time,value:state.lock})));
  }
  if(chartA)chartA.timeScale().fitContent();if(chartB)chartB.timeScale().fitContent();if(chartC)chartC.timeScale().fitContent();
  if(!lastT){document.getElementById("legPx").textContent="no ticks";return;}
  const bookT=ticksFor(state.game,primary==="Kalshi"||primary==="Polymarket"?"Circa":primary,state.market).slice(-1)[0]||lastT;
  const bookPx=priceOf(bookT);
  const chg=(impl(bookPx)||0)-(impl(firstPx)||0);
  const el=document.getElementById("legPx");el.className="px "+(chg>=0?"up":"dn");
  el.textContent=pct(impl(bookPx))+"  "+fmtAm(bookPx)+"  "+(chg>=0?"+":"")+(chg*100).toFixed(1);
  document.getElementById("legName").textContent=bookT.away+" @ "+bookT.home;
  document.getElementById("legSrc").textContent=primary+" "+state.market+(bookT.line?" "+bookT.line:"")+" · "+state.side;
  const k=ticksFor(state.game,"Kalshi","ML").slice(-1)[0];
  const p=ticksFor(state.game,"Polymarket","ML").slice(-1)[0];
  const pm=[k?"Kalshi "+Math.round((state.side==="home"?k.home_price:k.away_price)*100)+"¢":"",p?"Poly "+Math.round((state.side==="home"?p.home_price:p.away_price)*100)+"¢":""].filter(Boolean).join(" · ");
  document.getElementById("legMeta").textContent=(pm?pm+" · ":"")+(state.novig?"gold dash = no-vig · ":"")+"Δ vs Circa open · "+W.sot;
  document.getElementById("xaxis").innerHTML="<span>"+firstT.captured_at_pt+"</span><span>implied · juice · handle</span><span>"+lastT.captured_at_pt+"</span>";
}

  LIVE13.forEach(r=>{
    const dlt=(impl(r.ch)!=null&&impl(r.oh)!=null)?(impl(r.ch)-impl(r.oh))*100:null;
    const fl=flagSplit(r.rlm);
    const b=boardOf(r.id);
    const pip=b.status==="live"?"live":(b.status==="scheduled"?"open":"lock");

function renderDetails(){
  const rows=ticksFor(state.game,state.source,state.market);const last=rows[rows.length-1];
  if(!last){document.getElementById("details").innerHTML="<h4>Market</h4>No tick.";return;}
  const g=liveOf(state.game);const open=rows.find(t=>t.quality==="OPEN")||rows[0];
  const fl=g?flagSplit(g.rlm):{label:""};
  const dImp=((impl(priceOf(last))||0)-(impl(priceOf(open))||0))*100;const nv=noVig(last);

    last.away+" @ "+last.home+"<br/>Open "+fmtAm(priceOf(open))+" → last "+fmtAm(priceOf(last))+
    "<br/>Implied "+pct(impl(priceOf(last)))+" · no-vig "+(nv==null?"—":nv.toFixed(1)+"%")+" · Δ open "+(dImp>=0?"+":"")+dImp.toFixed(1)+

function boardOf(id){return BOARD[id]||{status:"",as:null,hs:null};}
function chime(kind){
  if(!state.sound)return;
  if(kind!=="steam"&&kind!=="live")return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator();const g=ctx.createGain();
    o.type="sine";o.frequency.value=kind==="live"?620:880;
    g.gain.value=0.03;o.connect(g);g.connect(ctx.destination);
    o.start();setTimeout(()=>{o.stop();ctx.close();},40);
  }catch(e){}
}
function toast(kind,kicker,line,game){
  const host=document.getElementById("toasts");if(!host)return;
  const el=document.createElement("div");
  el.className="toast "+(kind||"");
  el.innerHTML="<div class=\"kicker\">"+kicker+"</div><div class=\"line\">"+line+"</div>";
  if(game){el.style.cursor="pointer";el.onclick=()=>{state.game=game;state.source="Circa";state.tab="slate";persist();renderAll();};}
  host.appendChild(el);
  chime(kind);
  setTimeout(()=>{el.style.opacity="0";el.style.transform="translateY(6px)";},6200);
  setTimeout(()=>el.remove(),7000);
  while(host.children.length>4)host.removeChild(host.firstChild);
}

}

function parseLiveFeed(j){
  try{
    const ls=j.liveData&&j.liveData.linescore||{};
    const aw=((ls.teams||{}).away||{}).runs;
    const hm=((ls.teams||{}).home||{}).runs;
    if(aw!=null)LIVE.score=[aw,hm];
    if(ls.currentInning)LIVE.inn=ls.currentInning;
    if(ls.inningState)LIVE.state=ls.inningState;
    LIVE.balls=ls.balls;LIVE.strikes=ls.strikes;LIVE.outs=ls.outs;
    const plays=((j.liveData||{}).plays||{}).allPlays||[];
    const pts=[],tape=[];
    plays.forEach(p=>{
      const about=p.about||{}, match=p.matchup||{}, res=p.result||{};
      (p.playEvents||[]).forEach(ev=>{
        if(!ev.isPitch)return;
        const det=ev.details||{}, pd=ev.pitchData||{}, hd=ev.hitData||{}, c=(pd.coordinates||{});
        const br=pd.breaks||{};
        const row={i:about.inning,h:about.halfInning==="top"?"t":"b",p:((match.pitcher||{}).fullName||"").split(" ").pop(),b:(match.batter||{}).fullName,t:((det.type||{}).code)||"",tn:((det.type||{}).description)||"",c:((det.call||{}).description)||"",m:pd.startSpeed,x:c.pX,z:c.pZ,ev:hd.launchSpeed,la:hd.launchAngle,hb:br.breakHorizontal,ivb:br.breakVerticalInduced,vb:br.breakVertical,spin:br.spinRate,ext:pd.extension,zone:pd.zone,e:null};
        pts.push(row);
      });
      if(res.event)tape.push({i:about.inning,h:about.halfInning==="top"?"t":"b",p:((match.pitcher||{}).fullName||"").split(" ").pop(),b:(match.batter||{}).fullName,e:res.event,ev:null});
    });
    if(pts.length){LIVE.pitches=pts.slice(-80);LIVE.n=pts.length;}
    if(tape.length)LIVE.tape=tape.slice(-12);
    if(!LIVE.src||LIVE.src==="bake"||LIVE.src==="ws…")LIVE.src=LIVE.src||"poll";
    return pts.length;
  }catch(e){return 0;}
}
let lastStamp="";
async function pullLive(){
  try{

    if(tc)lastStamp=tc;
    if(parseLiveFeed(j))renderLive();
  }catch(e){}
}
async function pollStamps(){
  try{
    const arr=await fetch("https://statsapi.mlb.com/api/v1.1/game/"+LIVE.pk+"/feed/live/timestamps").then(r=>r.json());
    const last=Array.isArray(arr)&&arr.length?arr[arr.length-1]:"";
    if(last && last!==lastStamp){lastStamp=last;await pullLive();}
  }catch(e){await pullLive();}
}
function stopLive(){
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  if(liveKA){clearInterval(liveKA);liveKA=null;}
  if(liveDebounce){clearTimeout(liveDebounce);liveDebounce=null;}
  if(liveWS){try{liveWS.close();}catch(e){} liveWS=null;}

function onLivePing(){

function startLiveWS(){
  stopLive();
  LIVE.src="ws…";
  const urls=[
    "wss://ws.statsapi.mlb.com/api/v1/game/push/subscribe/gameday/"+LIVE.pk,
    "wss://ws.statsapi.mlb.com/api/v1/game/push/subscribe/"+LIVE.pk
  ];
  let i=0;
  const open=()=>{
    if(i>=urls.length){
      LIVE.src="stamp 2s";
      pullLive();
      liveTimer=setInterval(pollStamps,2000);
      renderLive();
      return;
    }
    let settled=false;
    const ws=new WebSocket(urls[i++]);
    liveWS=ws;
    const fail=()=>{if(settled)return;settled=true;try{ws.close();}catch(e){} open();};
    ws.onopen=()=>{
      settled=true;
      LIVE.src="ws push";
      liveKA=setInterval(()=>{if(ws.readyState===1)try{ws.send("Gameday5");}catch(e){}},55000);
      pullLive();
      renderLive();
    };
    ws.onmessage=()=>{LIVE.src="ws push";onLivePing();};
    ws.onerror=fail;
    ws.onclose=()=>{
      if(liveWS===ws){liveWS=null;if(LIVE.src.indexOf("ws")===0){LIVE.src="stamp 2s";liveTimer=setInterval(pollStamps,2000);}}
    };
    setTimeout(()=>{if(!settled && ws.readyState!==1)fail();},2500);
  };
  open();
}

    '<div class="mod-stat"><b><i>n</i>'+r.n+'</b><b><i>Model hit</i>'+pct(r.hit)+'</b><b><i>Market hit</i>'+pct(r.mktHit)+'</b><b><i>Brier</i>'+(r.brier==null?"—":r.brier.toFixed(3))+'</b></div>'+
    '<p>Pick the side the recipe prices ≥50%. Flat 1u, no juice, no CLV dollars. n&lt;30 would stay EMPTY — we are over the floor.</p>'+
    '<div class="mod-rows"><div style="color:#8b93a7"><span>GAME</span><span>SCORE</span><span>P%</span><span></span></div>'+rows+'</div></div></div>';
  const rng=document.getElementById("modHfa");
  const name=document.getElementById("modName");
  if(rng) rng.oninput=()=>{RECIPE.hfa=+rng.value;RECIPE.name=name?name.value:RECIPE.name;document.getElementById("modHfaVal").textContent=RECIPE.hfa;renderModel();};
  if(name) name.onchange=()=>{RECIPE.name=name.value;};
}

const TEAM_CODE={"Colorado Rockies":"COL","Detroit Tigers":"DET","Philadelphia Phillies":"PHI","Atlanta Braves":"ATL","Los Angeles Angels":"LAA","Washington Nationals":"WSH","New York Mets":"NYM","New York Yankees":"NYY","Baltimore Orioles":"BAL","Toronto Blue Jays":"TOR","Los Angeles Dodgers":"LAD","Miami Marlins":"MIA","Houston Astros":"HOU","Tampa Bay Rays":"TB","Cincinnati Reds":"CIN","Milwaukee Brewers":"MIL","Pittsburgh Pirates":"PIT","Chicago Cubs":"CHC","Kansas City Royals":"KC","Boston Red Sox":"BOS","Seattle Mariners":"SEA","Athletics":"ATH","Oakland Athletics":"ATH","Texas Rangers":"TEX","Arizona Diamondbacks":"ARI","San Diego Padres":"SD","San Francisco Giants":"SF","Cleveland Guardians":"CLE","Minnesota Twins":"MIN","Chicago White Sox":"CWS","St. Louis Cardinals":"STL"};
function sanePx(a,b){const x=+a,y=+b;if(!Number.isFinite(x)||!Number.isFinite(y))return false;if(Math.abs(x)>400||Math.abs(y)>400)return false;return true;}
function fracPct(x){if(x==null||x==="")return null;const n=+x;if(!Number.isFinite(n))return null;return n<=1.5?Math.round(n*100):Math.round(n);}
function isoToPt(iso){
  if(!iso)return null;
  const ms=Date.parse(iso);
  if(!Number.isFinite(ms))return null;
  const pt=new Date(ms-7*3600*1000);
  const p=n=>String(n).padStart(2,"0");
  return pt.getUTCFullYear()+"-"+p(pt.getUTCMonth()+1)+"-"+p(pt.getUTCDate())+" "+p(pt.getUTCHours())+":"+p(pt.getUTCMinutes())+":"+p(pt.getUTCSeconds());
}
function ingestStore(payload){
  const rows=Array.isArray(payload)?payload:(payload.rows||payload.ticks||payload.games||[]);
  if(!rows.length)return 0;
  let n=0,lastTs=W.captured_at_pt;
  rows.forEach(g=>{
    const teams=g.teams||{};
    const awayName=g.away_team||teams.away;
    const homeName=g.home_team||teams.home;
    const ac=TEAM_CODE[awayName];const hc=TEAM_CODE[homeName];
    if(!ac||!hc)return;
    const start=g.start_time||"";
    if(start&&!String(start).startsWith("2026-09-13")&&!(g.event_id||"").includes("2026-09-13"))return;
    const id=ac+"@"+hc;
    const circa=g.circa_ml||{};
    const pin=g.pinnacle_ml||{};
    const eag=g.eag_ml||{};
    const books=g.books||{};
    const ca=g.circa_away!=null?g.circa_away:circa.away;
    const ch=g.circa_home!=null?g.circa_home:circa.home;
    const pa=g.pinnacle_away!=null?g.pinnacle_away:(pin.away!=null?pin.away:(books.pinnacle&&books.pinnacle.away));
    const ph=g.pinnacle_home!=null?g.pinnacle_home:(pin.home!=null?pin.home:(books.pinnacle&&books.pinnacle.home));
    const da=books.draftkings&&books.draftkings.away;
    const dh=books.draftkings&&books.draftkings.home;
    const ea=eag.away!=null?eag.away:(books.eag&&books.eag.away);
    const eh=eag.home!=null?eag.home:(books.eag&&books.eag.home);
    const ts=isoToPt(g.circa_line_at||(books.circa&&books.circa.updated_at)||g.updated_at)||W.captured_at_pt;
    const hit=LIVE13.find(x=>x.id===id)||{};
    const meta={slate_date:"2026-09-13",game_id:id,event_id:g.event_id,away:hit.away||awayName,home:hit.home||homeName,notes:"STORE live"};
    if(ca!=null&&ch!=null){tick(Object.assign({captured_at_pt:ts,source:"Circa",away_price:ca,home_price:ch,away_handle:fracPct(g.circa_away_handle),home_handle:fracPct(g.circa_home_handle),away_tickets:fracPct(g.circa_away_bets),home_tickets:fracPct(g.circa_home_bets),quality:"FULL"},meta));n++;}
    if(sanePx(pa,ph)){tick(Object.assign({captured_at_pt:isoToPt((books.pinnacle&&books.pinnacle.updated_at)||ts),source:"Pinnacle",away_price:pa,home_price:ph,quality:"FULL"},meta));n++;}
    if(da!=null&&dh!=null){tick(Object.assign({captured_at_pt:isoToPt((books.draftkings&&books.draftkings.updated_at)||ts),source:"DK",away_price:da,home_price:dh,quality:"PARTIAL"},meta));n++;}
    if(ea!=null&&eh!=null){tick(Object.assign({captured_at_pt:isoToPt((books.eag&&books.eag.updated_at)||ts),source:"EAGAG",away_price:ea,home_price:eh,quality:"FULL"},meta));n++;}
    lastTs=ts;
  });
  if(n){W.sot="store-live";W.captured_at_pt=lastTs;}
  return n;
}
function markSot(live){
  const chip=document.getElementById("sotChip");
  chip.textContent=live?"STORE live":"STORE bake";
  chip.className=live?"chip live":"chip warn";
  document.getElementById("sotLine").textContent=live
    ?"warehouse.ticks · Neon SoT verified · STORE /games live · no browser URI"
    :"warehouse.ticks · Neon SoT verified · STORE /games bake 07:55 PT · tunnel has no CORS";
}
(async function tryStore(){
  try{
    const j=await fetch(STORE_URL).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
    const n=ingestStore(j);
    markSot(n>0);
    if(n)renderAll();
  }catch(e){markSot(false);}
})();
const sndBtn=document.getElementById("sndBtn");
if(sndBtn){sndBtn.onclick=()=>{state.sound=!state.sound;sndBtn.textContent=state.sound?"sound":"mute";sndBtn.title=state.sound?"alerts armed":"alerts muted";sndBtn.classList.toggle("on",state.sound);persist();};}
setInterval(tickClock,1000);tickClock();
bootAlerts();
renderAll();
</script>
